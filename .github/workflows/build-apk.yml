name: Build APK

# يبني ملف APK جاهزًا للتثبيت على أي push أو يدويًا من تبويب Actions.
# نسخة debug موقّعة بمفتاح التطوير، أي أنها تُثبَّت على الهاتف مباشرة.
on:
  push:
    branches: [ main, 'arena/**' ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'تشغيل اختبارات الوحدات أيضًا'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: assembleDebug + artifact
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # gradle-wrapper.jar ملف ثنائي غير مودَع في المستودع، لذا نولّده هنا.
      - name: Generate the Gradle wrapper
        run: gradle wrapper --gradle-version 8.9 --no-daemon

      - name: Show environment
        run: |
          java -version
          ./gradlew --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          set +e
          ./gradlew :app:assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      # إذا فشل البناء ننشر الأخطاء في المستودع نفسه (لا يمكن قراءة سجلات Actions برمجيًا
      # من بيئات الشبكة المقيدة). [skip ci] تمنع حلقة إعادة تشغيل لا نهائية.
      - name: Publish build errors (only on failure)
        if: steps.build.outcome == 'failure'
        run: |
          {
            echo "# أخطاء البناء (توليد تلقائي من CI)"
            echo
            echo '```'
            grep -E "^e: |^error:|FAILURE:|What went wrong|^> Task .* FAILED|Execution failed|Caused by:|AAPT|ERROR:" build.log | head -250
            echo '```'
            echo
            echo "## آخر 120 سطرًا"
            echo
            echo '```'
            tail -n 120 build.log
            echo '```'
          } > ci-build-log.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-build-log.md
          git commit -m "ci: publish build errors [skip ci]"
          git push

      # continue-on-error على خطوة البناء يجعل النتيجة الخضراء كاذبة؛ هذه الخطوة تُفشل
      # التشغيل فعليًا حتى لا يُنشر APK قديم وحتى يظهر الفشل بوضوح.
      - name: Fail the run when the build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::Debug build failed - see ci-build-log.md on this branch for the compiler output."
          exit 1

      - name: Collect APKs
        if: steps.build.outcome == 'success'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/USB-Media-Explorer-debug.apk
          ls -la dist

      - name: Upload debug APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: USB-Media-Explorer-debug-apk
          path: dist/USB-Media-Explorer-debug.apk
          if-no-files-found: error
          retention-days: 30

      # continue-on-error حتى نستطيع نشر تقرير الفشل من داخل المستودع، وخطوة
      # "Fail the run when the tests failed" below تُفشل التشغيل فعليًا.
      - name: Unit tests
        id: tests
        if: steps.build.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.run_tests)
        continue-on-error: true
        run: |
          set +e
          ./gradlew :app:testDebugUnitTest --no-daemon --console=plain --continue 2>&1 | tee tests.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Publish test failures (only on failure)
        if: steps.tests.outcome == 'failure'
        run: |
          {
            echo "# فشل اختبارات الوحدات (توليد تلقائي من CI)"
            echo
            echo '```'
            grep -E "FAILED|AssertionError|expected:|ComparisonFailure|^e: |error:|Test.*>.*FAILED" tests.log | head -200
            echo '```'
            echo
            echo "## آخر 80 سطرًا"
            echo
            echo '```'
            tail -n 80 tests.log
            echo '```'
          } > ci-test-log.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-test-log.md
          git commit -m "ci: publish unit test failures [skip ci]"
          git push

      - name: Fail the run when the tests failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::error::Unit tests failed - see ci-test-log.md on this branch."
          exit 1

      - name: Build release APK (unsigned)
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Upload release APK
        if: steps.build.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: USB-Media-Explorer-release-unsigned-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 30

      # ينشر الـAPK في Release ثابت اسمه apk-latest حتى يبقى رابط التنزيل واحدًا
      # ولا يحتاج المستخدم للدخول إلى سجل تشغيل Actions في كل مرة.
      - name: Publish APKs to the apk-latest release
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 'أحدث نسخة APK جاهزة — USB Media Explorer'
          body: |
            ملف APK مبني تلقائيًا من آخر commit على هذا الفرع.

            - `USB-Media-Explorer-debug.apk` — **جاهز للتثبيت مباشرة** (موقّع بمفتاح التطوير).
            - `app-release-unsigned.apk` — نسخة مصغّرة بـ R8 (أصغر بكثير) لكنها تحتاج توقيعًا قبل التثبيت.

            للتثبيت: انقل الملف إلى الهاتف ثم افتحه، وفعّل «التثبيت من مصادر غير معروفة» عند الطلب.
          files: |
            dist/USB-Media-Explorer-debug.apk
            app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: false

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v') && steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/USB-Media-Explorer-debug.apk
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: false
